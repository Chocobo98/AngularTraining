<app-header></app-header>
<main>
  <ul id="users">
    @for (user of users; track user.id) {
      <!-- Structural Directives -->
      <li>
        <app-user
          [selected]="user.id === singleUserId"
          [user]="user"
          (clickOnUser)="onSelectedUser($event)"
        />
      </li>
    }
  </ul>

  <!-- @if (selectedUserName()?.name != "") {
    <app-tasks [name]="selectedUserName()?.name" />
  } @else {
    <p id="fallback">Selected a user to see their tasks!</p>
  } -->

  @if (singleUserId) {
    <app-tasks
      [userId]="selectedUserName.id"
      [name]="selectedUserName.name"
    ></app-tasks>
  } @else {
    <p id="fallback">Please select a user to check their tasks!</p>
  }
</main>
