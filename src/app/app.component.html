<app-header></app-header>
<main>
  <ul id="users">
    <!-- @for (user of users; track user.id) { -->
    <!-- Structural Directives -->
    <li *ngFor="let user of users">
      <app-user [user]="user" (clickOnUser)="onSelectedUser($event)" />
    </li>
    <!-- } -->
  </ul>

  <!-- @if (selectedUserName()?.name != "") {
    <app-tasks [name]="selectedUserName()?.name" />
  } @else {
    <p id="fallback">Selected a user to see their tasks!</p>
  } -->

  <!-- @if (singleUserId) { -->
  <app-tasks
    *ngIf="singleUserId; else fallback"
    [name]="selectedUserName!.name"
  ></app-tasks>
  <!-- } @else { -->
  <ng-template #fallback>
    <p id="fallback">Please select a user to check their tasks!</p>
  </ng-template>
  <!-- } -->
</main>
