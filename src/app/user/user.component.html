<app-card>
  <button [class.active]="selected" (click)="onSelectedUser()">
    <!--Property Binding (Dynamic)-->
    <!-- Changed for Signals and now it needs consider as a function-->
    <!-- Change back to Property Binding  due Components INputs (This will be a pain in the ass)-->
    <img [src]="imagePath" [alt]="user.name" />
    <!-- String Interpolation (Allows you to put any property or js stuff inside the {{ }} )-->
    <span>{{ user.name }}</span>
  </button>
</app-card>
